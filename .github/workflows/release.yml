name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write      # the GitHub release
  packages: write      # ghcr.io/xen0bit/hbb
  id-token: write      # build provenance
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Pin the model at release time here, or leave empty for hbb.lock.json's.
      HBB_MODEL_REPO: ${{ vars.HBB_MODEL_REPO }}
      HBB_MODEL_REVISION: ${{ vars.HBB_MODEL_REVISION }}
      HBB_MODEL_VARIANT: ${{ vars.HBB_MODEL_VARIANT }}
    steps:
      # Five full builds are ~3 GB of binaries and as much again in archives and images.
      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          # each full build links a 600 MB embed: two at a time fits the runner's memory
          args: release --clean --parallelism 2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@v2
        with:
          subject-checksums: dist/checksums.txt
