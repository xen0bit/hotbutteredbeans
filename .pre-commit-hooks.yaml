# For the pre-commit framework (https://pre-commit.com). In .pre-commit-config.yaml:
#
#   - repo: https://github.com/xen0bit/hotbutteredbeans
#     rev: v0.1.0
#     hooks:
#       - id: hbb              # builds hbb with Go; the model is fetched on first run
#       # - id: hbb-system     # uses the hbb on PATH instead
#
# hbb reads the staged changes itself, so no file names are passed. It reports and lets
# the commit through unless fail_at is set in .hbb.yaml. A hook never downloads the model
# unless hook.fetch is true: run `hbb model fetch` once (or set it).
- id: hbb
  name: hbb (security triage of the staged changes)
  description: Rank the staged code by likely CWE Top 25 weaknesses with a local model.
  entry: hbb diff --staged --hook
  language: golang
  pass_filenames: false
  require_serial: true
  stages: [pre-commit]
- id: hbb-system
  name: hbb (security triage of the staged changes)
  description: Same, with the hbb already installed on PATH.
  entry: hbb diff --staged --hook
  language: system
  pass_filenames: false
  require_serial: true
  stages: [pre-commit]
- id: hbb-pre-push
  name: hbb (security triage of the pushed commits)
  entry: hbb diff --pre-push --hook
  language: system
  pass_filenames: false
  require_serial: true
  stages: [pre-push]
